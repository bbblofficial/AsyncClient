name: Build Forge Mod 1.8.9

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    # دانلود و نصب خودکار گریدل سازگار با ماینکرافت 1.8.9
    # این اکشن کش را هم به صورت خودکار مدیریت می‌کند
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '2.14.1'

    # اجرای دستور گریدل به صورت مستقیم (بدون نیاز به فایل gradlew)
    - name: Build Mod with Gradle
      run: gradle build

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AsyncMenuLoad-1.8.9
        path: build/libs/*.jar