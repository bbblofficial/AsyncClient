name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Cache Gradle / ForgeGradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
          key: ${{ runner.os }}-fg21-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: |
            ${{ runner.os }}-fg21-

      # ForgeGradle 2.1 only works with Gradle 2.14.1, so we install it directly.
      - name: Install Gradle 2.14.1
        run: |
          curl -fsSL -o gradle.zip https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Build
        run: gradle setupCIWorkspace build --no-daemon --stacktrace

        - name: Upload jar
          uses: actions/upload-artifact@v4
          with:
            name: AsyncMenus-jar
            path: |
              build/libs/*.jar
              !build/libs/*-sources.jar
            if-no-files-found: error
